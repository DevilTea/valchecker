name: Feature request
description: Propose a new step, helper, or capability.
labels: ['type: feature', 'status: needs-triage']
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: >
        The validation problem, not the API you have in mind. This often changes which solution
        turns out to be right.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: >
        How it would read at a call site. Naming follows nouns for initial schemas, `isXxx` for
        validations that preserve the value, and `toXxx` for transformations.
      render: ts
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: What you do today
      description: >
        The current workaround — often `check()`, `transform()`, or composing existing steps. If it
        works, say what makes it insufficient.
    validations:
      required: true
