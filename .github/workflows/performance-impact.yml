name: Performance Impact
run-name: Performance impact ${{ inputs.before || github.event.pull_request.base.sha || github.event.before }} → ${{ inputs.after || github.event.pull_request.head.sha || github.sha }} by @${{ github.actor }}

# Before/after benchmark comparison, used three ways:
#   - pull_request: automatic performance gate, before = PR base, after = PR head,
#     scoped to the scenarios the diff can move.
#   - push to main: the same comparison for one merge, unscoped, so whatever the
#     scoping missed surfaces within a day and is attributed to the merge that caused
#     it. A nightly aggregate was the alternative and was rejected: it would compare a
#     day of merges at once, so a regression in one and an improvement in another can
#     cancel, and the bisect it forces costs more than the runs it saves. At this
#     repository's rate — six merges touching package source on the busiest recent day
#     — per-merge runs are affordable on the hosted runners and name the merge outright.
#     It covers every change class the selector treats as a full run, not only package
#     source: a dependency bump or a compiler-configuration change is the class most
#     able to move every number at once, and it is the class the scoped run cannot
#     narrow.
#   - workflow_dispatch: manual comparison of two arbitrary refs, with optional
#     competitor adapters and scenario selection.
#
# Scenario scoping (pull requests only). Measuring all 169 standard-tier scenarios is
# 55 minutes against a 90-minute timeout, and neither of the two decisions behind that
# can be reverted: five paired repetitions are what make a scenario classifiable at
# all (#124), and one process per cell is what makes a subset measure the same numbers
# as the whole suite (#127). So the run is scoped instead, by mapping each changed file
# through the internal import graph to the steps that import it and then to the
# scenarios whose declared `steps` name them. `scripts/impact-selection.ts` holds the
# mapping and everything it refuses to decide; anything it cannot place is a full run,
# and a canary set — every construction and cold scenario plus the core execution paths
# — runs whatever the diff says, because module initialisation is not attributable
# through a scenario's `steps` at all. The `paths` filters below therefore have to
# admit every path that module can call a full run, or the rule cannot fire;
# `scripts/check-impact-triggers.ts` fails when they do not.
#
# The comparison *scripts* always come from the checked-out ref (PR merge ref, or
# the dispatched ref), so the compare tooling and scenario selection are fixed;
# `before` and `after` are only two valchecker builds the fixed scripts point at
# via VALCHECKER_DIST_URL. valchecker before/after is measured with the rigorous
# paired process comparison; selected competitor adapters are shown as standing
# vs peers in each build via the ranking report.
#
# This gate is deliberately NOT sharded, unlike Performance Comparison. Scenario
# sharding would preserve the per-scenario classifier — all repetitions of both
# sides for one scenario would still be adjacent on one machine, and a paired ratio
# cancels machine speed — but it would turn the severe-GROUP trigger (5% geometric
# mean across two or more stable scenarios) into an aggregate over several runners,
# and that trigger is the one that catches broad moderate regressions the 10%
# per-scenario threshold misses. Every shard job would also have to install and
# build both revisions, a fixed cost that does not shard, so the wall-time saving is
# well under 1/N while runner minutes multiply and 5 repetitions x 2 sides x N
# shards of artefacts have to be fanned out, merged, and paired. `compare` refuses
# to pair runs whose shard count or isolation differs, so a future attempt to shard
# one side fails loudly instead of comparing across machines silently.

on:
  workflow_dispatch:
    inputs:
      before:
        description: Baseline git ref (branch, tag, or SHA)
        required: true
        type: string
      after:
        description: Candidate git ref (defaults to the dispatched ref)
        required: false
        default: ''
        type: string
      adapters:
        description: Competitor adapters to show alongside valchecker, comma-separated (e.g. valibot,zod3). Empty = valchecker only.
        required: false
        default: ''
        type: string
      scenarios:
        description: Scenario ids or group names to run, comma-separated (e.g. primitive/valid,warm/failure/first). Empty = all scenarios for the profile.
        required: false
        default: ''
        type: string
      profile:
        description: Sampling profile
        required: true
        default: standard
        type: choice
        options:
          - smoke
          - standard
          - full
      runs:
        description: Paired repetitions for the impact comparison (minimum 3)
        required: false
        default: '5'
        type: string
      fail_on_regression:
        description: Fail the job when the impact verdict is a regression
        required: false
        default: false
        type: boolean
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    # The complement of what `scripts/impact-selection.ts` can prove harmless, not an
    # enumeration of source directories. The selector's most conservative rules force a
    # full run for a lockfile, a package manifest, a `tsdown.config.ts`, a
    # `tsconfig.json`, an unrecognised new path, and for the files that define this gate
    # — and a rule whose path never starts the workflow can never fire. Listing source
    # directories left every one of those unreachable, so the filter is now written as
    # `**` minus the exclusions in `cannotChangeTheBuild`, with the gate-defining files
    # re-included after the directories that would otherwise swallow them.
    # `scripts/check-impact-triggers.ts` fails when the two disagree.
    #
    # `benchmarks/**` is not excluded here: it cannot change either build, so it is only
    # ever the canary, but that canary is the one thing that would notice a change to the
    # measuring apparatus moving both sides at once.
    paths:
      - '**'
      - '!docs/**'
      - '!type-performance/**'
      - '!artifacts/**'
      - '!coverage/**'
      - '!.agents/**'
      - '!.claude/**'
      - '!.vscode/**'
      - '!**.md'
      - '!LICENSE'
      - '!.editorconfig'
      - '!.gitignore'
      - '!.npmrc'
      - '!eslint.config.js'
      - '!vitest.config.ts'
      - '!api-surface.json'
      - '!release-plan.json'
      - '!scripts/**'
      - '!.github/**'
      - scripts/impact-selection.ts
      - scripts/select-impact-scenarios.ts
      - .github/workflows/performance-impact.yml
      - .github/actions/setup/action.yml
  push:
    branches:
      - main
    # The same complement, with one more exclusion: `benchmarks/**`. A merge that changes
    # only the measuring apparatus leaves both revisions building the same library, so
    # the unscoped post-merge comparison has nothing to find. Everything the selector can
    # force a full run for is here, because this run is the net under the scoped one and
    # a dependency bump or a compiler-configuration change is the class most able to move
    # every number at once.
    paths:
      - '**'
      - '!docs/**'
      - '!benchmarks/**'
      - '!type-performance/**'
      - '!artifacts/**'
      - '!coverage/**'
      - '!.agents/**'
      - '!.claude/**'
      - '!.vscode/**'
      - '!**.md'
      - '!LICENSE'
      - '!.editorconfig'
      - '!.gitignore'
      - '!.npmrc'
      - '!eslint.config.js'
      - '!vitest.config.ts'
      - '!api-surface.json'
      - '!release-plan.json'
      - '!scripts/**'
      - '!.github/**'
      - scripts/impact-selection.ts
      - scripts/select-impact-scenarios.ts
      - .github/workflows/performance-impact.yml
      - .github/actions/setup/action.yml

permissions:
  contents: read

concurrency:
  group: performance-impact-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compare:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout comparison tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/setup
        with:
          build: 'false'
          benchmarks: 'true'

      - name: Resolve comparison parameters
        id: params
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          INPUT_BEFORE: ${{ inputs.before }}
          INPUT_AFTER: ${{ inputs.after }}
          INPUT_ADAPTERS: ${{ inputs.adapters }}
          INPUT_SCENARIOS: ${{ inputs.scenarios }}
          INPUT_PROFILE: ${{ inputs.profile }}
          INPUT_RUNS: ${{ inputs.runs }}
          INPUT_FAIL: ${{ inputs.fail_on_regression }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            # Five repetitions, not three. A scenario is only classified when its
            # paired ratio is stable, and at three repetitions the interval is so
            # wide that most scenarios are not: across four historical runs, 27 to
            # 44 of 80 could be judged, so the gate was blind to more than half of
            # what it was watching. The interval narrows with both the wider t
            # quantile and the extra samples, which puts 56 to 68 of the same 80
            # inside the threshold. It costs about ten minutes, and the gate can
            # only ever pass a scenario it cannot judge.
            {
              echo "before=$PR_BASE_SHA"
              echo "after=$PR_HEAD_SHA"
              echo "adapters="
              echo "scenarios="
              echo "profile=standard"
              echo "runs=5"
              echo "fail_on_regression=true"
            } >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            # The unscoped comparison of one merge. `github.event.before` is the tip
            # main pointed at before this push, so the diff measured here is exactly the
            # merge's own; it is the all-zero sha only for a branch's first push, where
            # the parent is the honest baseline.
            before="$PUSH_BEFORE_SHA"
            if ! git rev-parse --verify --quiet "${before}^{commit}" > /dev/null; then
              before="${GITHUB_SHA}^"
            fi
            {
              echo "before=$before"
              echo "after=$GITHUB_SHA"
              echo "adapters="
              echo "scenarios="
              echo "profile=standard"
              echo "runs=5"
              echo "fail_on_regression=true"
            } >> "$GITHUB_OUTPUT"
          else
            runs="$INPUT_RUNS"
            if ! [[ "$runs" =~ ^[0-9]+$ ]] || [ "$runs" -lt 3 ]; then
              runs=3
            fi
            {
              echo "before=$INPUT_BEFORE"
              echo "after=${INPUT_AFTER:-$GITHUB_SHA}"
              echo "adapters=$INPUT_ADAPTERS"
              echo "scenarios=$INPUT_SCENARIOS"
              echo "profile=$INPUT_PROFILE"
              echo "runs=$runs"
              echo "fail_on_regression=$INPUT_FAIL"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Build before and after revisions
        id: builds
        shell: bash
        env:
          BEFORE_REF: ${{ steps.params.outputs.before }}
          AFTER_REF: ${{ steps.params.outputs.after }}
        run: |
          set -euo pipefail
          git fetch --all --tags --quiet || true
          before_sha="$(git rev-parse --verify "${BEFORE_REF}^{commit}")"
          after_sha="$(git rev-parse --verify "${AFTER_REF}^{commit}")"
          echo "before_sha=$before_sha" >> "$GITHUB_OUTPUT"
          echo "after_sha=$after_sha" >> "$GITHUB_OUTPUT"

          git worktree add ../valchecker-before "$before_sha"
          pnpm --dir ../valchecker-before install --frozen-lockfile
          pnpm --dir ../valchecker-before build

          git worktree add ../valchecker-after "$after_sha"
          pnpm --dir ../valchecker-after install --frozen-lockfile
          pnpm --dir ../valchecker-after build

          dist_url() { node -e "console.log(require('node:url').pathToFileURL(require('node:path').resolve(process.argv[1])).href)" "$1"; }
          {
            echo "before_dist=$(dist_url ../valchecker-before/packages/valchecker/dist/index.mjs)"
            echo "after_dist=$(dist_url ../valchecker-after/packages/valchecker/dist/index.mjs)"
          } >> "$GITHUB_OUTPUT"

      - name: Scope the run to the scenarios the diff can move
        id: scope
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          BEFORE_SHA: ${{ steps.builds.outputs.before_sha }}
          AFTER_SHA: ${{ steps.builds.outputs.after_sha }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/performance-impact
          # The diff between exactly the two revisions being built, and the attribution
          # graph read from the candidate worktree, which is the tree whose build is
          # measured as `after`.
          git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" > artifacts/performance-impact/changed-files.txt
          pnpm bench:impact-scope \
            --changed-files artifacts/performance-impact/changed-files.txt \
            --tree ../valchecker-after \
            --markdown artifacts/performance-impact/selection.md \
            --summary "$GITHUB_STEP_SUMMARY" \
            --github-output "$GITHUB_OUTPUT"

      - name: Run interleaved paired benchmarks
        shell: bash
        env:
          PROFILE: ${{ steps.params.outputs.profile }}
          SCENARIOS: ${{ steps.scope.outputs.scenarios || steps.params.outputs.scenarios }}
          RUNS: ${{ steps.params.outputs.runs }}
          BEFORE_DIST: ${{ steps.builds.outputs.before_dist }}
          AFTER_DIST: ${{ steps.builds.outputs.after_dist }}
          BEFORE_SHA: ${{ steps.builds.outputs.before_sha }}
          AFTER_SHA: ${{ steps.builds.outputs.after_sha }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/performance-impact

          scenario_args=()
          if [[ -n "$SCENARIOS" ]]; then
            scenario_args=(--scenarios "$SCENARIOS")
          fi
          seed="compare-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          run_side() {
            local side="$1" dist="$2" repetition="$3" sha="$4"
            VALCHECKER_DIST_URL="$dist" \
            BENCHMARK_COMMIT="$sha" \
            pnpm --dir benchmarks bench \
              --mode "$PROFILE" \
              --adapters valchecker \
              --seed "$seed-$repetition-$side" \
              --output "../artifacts/performance-impact/$side-$repetition.json" \
              "${scenario_args[@]}"
          }

          for repetition in $(seq 1 "$RUNS"); do
            if (( repetition % 2 == 0 )); then
              run_side baseline "$BEFORE_DIST" "$repetition" "$BEFORE_SHA"
              run_side candidate "$AFTER_DIST" "$repetition" "$AFTER_SHA"
            else
              run_side candidate "$AFTER_DIST" "$repetition" "$AFTER_SHA"
              run_side baseline "$BEFORE_DIST" "$repetition" "$BEFORE_SHA"
            fi
          done

      - name: Compare benchmark impact
        shell: bash
        env:
          RUNS: ${{ steps.params.outputs.runs }}
          FAIL_ON_REGRESSION: ${{ steps.params.outputs.fail_on_regression }}
        run: |
          set -euo pipefail
          compare_args=()
          for repetition in $(seq 1 "$RUNS"); do
            compare_args+=(--baseline "../artifacts/performance-impact/baseline-$repetition.json")
          done
          for repetition in $(seq 1 "$RUNS"); do
            compare_args+=(--candidate "../artifacts/performance-impact/candidate-$repetition.json")
          done
          fail_flag=()
          if [[ "$FAIL_ON_REGRESSION" == "true" ]]; then
            fail_flag=(--fail-on-regression)
          fi
          pnpm --dir benchmarks compare \
            "${compare_args[@]}" \
            --markdown ../artifacts/performance-impact/impact.md \
            --json ../artifacts/performance-impact/impact.json \
            --html ../artifacts/performance-impact/impact.html \
            "${fail_flag[@]}"

      - name: Benchmark standing versus competitors
        if: ${{ steps.params.outputs.adapters != '' }}
        shell: bash
        env:
          PROFILE: ${{ steps.params.outputs.profile }}
          SCENARIOS: ${{ steps.params.outputs.scenarios }}
          ADAPTERS: ${{ steps.params.outputs.adapters }}
          BEFORE_DIST: ${{ steps.builds.outputs.before_dist }}
          AFTER_DIST: ${{ steps.builds.outputs.after_dist }}
          BEFORE_SHA: ${{ steps.builds.outputs.before_sha }}
          AFTER_SHA: ${{ steps.builds.outputs.after_sha }}
        run: |
          set -euo pipefail
          scenario_args=()
          if [[ -n "$SCENARIOS" ]]; then
            scenario_args=(--scenarios "$SCENARIOS")
          fi
          seed="compare-context-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          # Each build reports into its own directory so report-all's sibling
          # summary.md files (dirname(markdown)/summary.md) do not collide.
          context() {
            local side="$1" dist="$2" sha="$3"
            mkdir -p "artifacts/performance-impact/$side-context"
            VALCHECKER_DIST_URL="$dist" \
            BENCHMARK_COMMIT="$sha" \
            pnpm --dir benchmarks bench \
              --mode "$PROFILE" \
              --adapters "valchecker,$ADAPTERS" \
              --seed "$seed-$side" \
              --output "../artifacts/performance-impact/$side-context/raw.json" \
              "${scenario_args[@]}"
            pnpm --dir benchmarks report \
              --input "../artifacts/performance-impact/$side-context/raw.json" \
              --markdown "../artifacts/performance-impact/$side-context/report.md" \
              --html "../artifacts/performance-impact/$side-context/report.html"
          }

          context before "$BEFORE_DIST" "$BEFORE_SHA"
          context after "$AFTER_DIST" "$AFTER_SHA"

      - name: Publish comparison summary
        if: always()
        shell: bash
        env:
          BEFORE_REF: ${{ steps.params.outputs.before }}
          AFTER_REF: ${{ steps.params.outputs.after }}
          BEFORE_SHA: ${{ steps.builds.outputs.before_sha }}
          AFTER_SHA: ${{ steps.builds.outputs.after_sha }}
          ADAPTERS: ${{ steps.params.outputs.adapters }}
          SCENARIOS: ${{ steps.params.outputs.scenarios }}
          SCOPE_COUNT: ${{ steps.scope.outputs.count }}
          PROFILE: ${{ steps.params.outputs.profile }}
        run: |
          set -euo pipefail
          # A reader of a passing gate has to see how much was measured, so the count
          # replaces the word "all" whenever the run was scoped.
          scenarios_cell="${SCENARIOS:-all}"
          if [[ -n "$SCOPE_COUNT" ]]; then
            scenarios_cell="${SCOPE_COUNT} selected — see **Scenario scope** above"
          fi
          {
            echo "# Performance impact"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Before | \`${BEFORE_REF}\` (${BEFORE_SHA:-unresolved}) |"
            echo "| After | \`${AFTER_REF}\` (${AFTER_SHA:-unresolved}) |"
            echo "| Profile | ${PROFILE} |"
            echo "| Scenarios | ${scenarios_cell} |"
            echo "| Competitors | ${ADAPTERS:-none} |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ -f artifacts/performance-impact/impact.md ]]; then
            cat artifacts/performance-impact/impact.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "> Impact report was not produced; see the job logs." >> "$GITHUB_STEP_SUMMARY"
          fi

          for side in after before; do
            summary="artifacts/performance-impact/${side}-context/summary.md"
            if [[ -f "$summary" ]]; then
              printf '\n## Standing versus competitors — %s build\n\n' "$side" >> "$GITHUB_STEP_SUMMARY"
              cat "$summary" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Upload benchmark comparison
        if: always() && hashFiles('artifacts/performance-impact/**') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: performance-impact-${{ github.event.pull_request.number || github.run_id }}-${{ github.run_attempt }}
          path: artifacts/performance-impact
          if-no-files-found: error
          retention-days: 30
